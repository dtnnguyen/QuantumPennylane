name: Run scripts

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run each script
        env:
          MPLBACKEND: Agg   # no screen on GitHub's machines: save plots without opening a window
        run: |
          for f in PennylaneTutorial/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: plots
          path: PennylaneTutorial/images/
